<script>
  (function initOTPCountdown() {
    let timeLeft = 42;
    const timerElem = document.getElementById('timer-display');
    const resendBtn = document.getElementById('resend-btn');

    const countdown = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(countdown);
        if (timerElem) timerElem.textContent = 'Code expired';
        if (resendBtn) {
          resendBtn.disabled = false;
          resendBtn.classList.remove('text-outline', 'cursor-not-allowed');
          resendBtn.classList.add('text-coach-orange', 'cursor-pointer', 'underline');
        }
      } else {
        const sec = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
        if (timerElem) timerElem.textContent = `Resend code in 00:${sec}`;
      }
    }, 1000);
  })();
