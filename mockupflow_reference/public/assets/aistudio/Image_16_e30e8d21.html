 "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface font-body-md text-charcoal-dark min-h-screen flex flex-col selection:bg-athletic-green-subtle selection:text-athletic-green"><div class="fixed top-0 left-0 z-50 pt-safe px-margin"><div class="h-16 flex items-center"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full bg-canvas-base/80 backdrop-blur-md shadow-[0_1px_8px_rgba(15,23,42,0.06)] text-charcoal-dark hover:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-2xl">arrow_back</span></button></div></div><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-10">
<!-- Subtle decorative kinetic aura -->
<div class="relative w-full overflow-hidden flex flex-col items-center">
<div class="absolute -top-12 w-64 h-64 bg-athletic-green-subtle/50 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute top-28 -right-10 w-48 h-48 bg-coach-orange-subtle/40 rounded-full blur-2xl pointer-events-none -z-10"></div>
<!-- Coach Bruno Welcome Mascot Unit -->
<div class="w-full max-w-sm mt-4 mb-5 flex items-center gap-space-md bg-canvas-base rounded-2xl p-space-md shadow-[0_8px_24px_-4px_rgba(22,163,74,0.08),0_2px_8px_-2px_rgba(15,23,42,0.04)] relative">
<!-- Mascot Avatar with Coach Bruno Brand Ring -->

<div class="w-16 h-16 rounded-full p-1 bg-coach-orange flex items-center justify-center shadow-md">

</div>
<div class="absolute -bottom-1 -right-1 w-5 h-5 bg-athletic-green rounded-full flex items-center justify-center text-canvas-base shadow-sm">
<span class="material-symbols-outlined text-xs leading-none" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
</div>
<!-- Bruno Speech Bubble Tail & Content -->
<div class="flex-1 min-w-0">
<div class="flex items-center gap-space-xs mb-0.5">
<span class="font-label-sm text-label-sm text-coach-orange uppercase tracking-wider">Coach Bruno</span>
<span class="w-1.5 h-1.5 rounded-full bg-athletic-green animate-ping"></span>
</div>
<p class="font-body-md text-body-md text-charcoal-dark font-medium leading-snug">
          “Welcome back, lifter! Ready to hit the iron?”
        </p>
</div>
</div>
<!-- Main Auth Card -->
<div class="w-full max-w-sm bg-canvas-base rounded-2xl p-space-lg shadow-[0_12px_32px_-6px_rgba(15,23,42,0.06),0_2px_8px_0_rgba(15,23,42,0.02)] flex flex-col gap-space-lg">
<!-- Title & Context -->
<div class="flex flex-col gap-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-charcoal-dark">
          Power Up
        </h1>
<p class="font-body-sm text-body-sm text-secondary">
          Track workouts, sync with your coach, and break records.
        </p>
</div>
<!-- Interactive Form Container -->
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleFormSubmit();">
<!-- Email Input Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-charcoal-dark" for="emailInput">
            Athletic ID / Email
          </label>
<div class="relative flex items-center rounded-xl bg-canvas-secondary transition-all duration-200 focus-within:bg-canvas-base focus-within:shadow-[0_0_0_2px_#16A34A]">
<div class="w-12 h-12 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-xl">mail</span>
</div>
<input class="w-full h-12 bg-transparent text-charcoal-dark font-body-md text-body-md placeholder:text-secondary/50 focus:outline-none pr-11" id="emailInput" oninput="validateEmail(this.value)" placeholder="athlete@gym.com" required="" type="email" value="alex.lift@ironclub.com"/>
<!-- Validation Check Node -->
<div class="absolute right-3.5 w-6 h-6 rounded-full bg-athletic-green-subtle flex items-center justify-center text-athletic-green transition-transform duration-200 scale-100" id="emailValidBadge">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
</div>
</div>
<!-- Password Input Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-charcoal-dark" for="passwordInput">
              Passcode
            </label>
<a class="font-label-sm text-label-sm text-athletic-green hover:text-athletic-green-hover transition-colors" href="#">
              Forgot Password?
            </a>
</div>
<div class="relative flex items-center rounded-xl bg-canvas-secondary transition-all duration-200 focus-within:bg-canvas-base focus-within:shadow-[0_0_0_2px_#16A34A]">
<div class="w-12 h-12 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-xl">lock</span>
</div>
<input class="w-full h-12 bg-transparent text-charcoal-dark font-body-md text-body-md placeholder:text-secondary/50 focus:outline-none pr-12" id="passwordInput" placeholder="Enter your password" required="" type="password" value="IronStrength2024!"/>
<!-- Toggle Eye Visibility -->
<button aria-label="Toggle password visibility" class="absolute right-1 w-11 h-11 flex items-center justify-center text-secondary hover:text-charcoal-dark rounded-full transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-xl" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action CTA -->
<button class="w-full h-14 mt-1 rounded-full bg-athletic-green active:bg-athletic-green-hover text-on-primary font-label-lg text-label-lg shadow-[0_10px_20px_-4px_rgba(22,163,74,0.35)] flex items-center justify-center gap-space-sm transition-all transform active:scale-[0.98]" id="submitButton" type="submit">
<span>Sign In with Bruno</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<!-- Alternative Quick Auth Divider -->
<div class="relative flex items-center justify-center my-1">
<div class="w-full h-[1px] bg-surface-container"></div>
<span class="absolute px-space-sm bg-canvas-base font-label-sm text-label-sm text-secondary uppercase">
          Or continue with
        </span>
</div>
<!-- Quick Auth Providers (Google & Apple) -->
<div class="grid grid-cols-2 gap-space-md">
<!-- Google Quick Button -->
<button class="h-13 py-3 px-space-md rounded-xl bg-canvas-secondary hover:bg-surface-container transition-colors flex items-center justify-center gap-space-sm text-charcoal-dark shadow-sm active:scale-[0.98]" type="button">
<svg class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15Z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md">Google</span>
</button>
<!-- Apple Quick Button -->
<button class="h-13 py-3 px-space-md rounded-xl bg-canvas-secondary hover:bg-surface-container transition-colors flex items-center justify-center gap-space-sm text-charcoal-dark shadow-sm active:scale-[0.98]" type="button">
<svg class="w-5 h-5 flex-shrink-0 fill-current text-charcoal-dark" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.89c.65-.8 1.09-1.92.97-3.04-.95.04-2.09.64-2.76 1.43-.59.68-1.11 1.79-.97 2.87 1.05.08 2.11-.47 2.76-1.26Z"></path>
</svg>
<span class="font-label-md text-label-md">Apple</span>
</button>
</div>
</div>
<!-- Bottom Sign-Up Link -->
<div class="mt-6 flex items-center justify-center gap-1.5 text-center">
<span class="font-body-md text-body-md text-secondary">
        Don't have an account?
      </span>
<button class="font-label-md text-label-md text-athletic-green hover:underline focus:outline-none" type="button">
        Sign Up
      </button>
</div>
<!-- Gym Session Quote / Micro Delight -->
<div class="mt-4 flex items-center gap-2 py-1 px-3 rounded-full bg-athletic-green-subtle/40 text-athletic-green font-label-sm text-label-sm">
<span class="material-symbols-outlined text-sm">bolt</span>
<span>Streak active: 4 day lift consistency</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    if (!pwdInput || !eyeIcon) return;
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function validateEmail(val) {
    const badge = document.getElementById('emailValidBadge');
    if (!badge) return;
    const re = /\S+@\S+\.\S+/;
    if (re.test(val)) {
      badge.classList.remove('scale-0', 'opacity-0');
      badge.classList.add('scale-100', 'opacity-100');
    } else {
      badge.classList.add('scale-0', 'opacity-0');
      badge.classList.remove('scale-100', 'opacity-100');
    }
  }

  function handleFormSubmit() {
    const btn = document.getElementById('submitButton');
    if (!btn) return;
    btn.innerHTML = `
      <span class="material-symbols-outlined text-xl animate-spin">progress_activity</span>
      <span>Loading Bruno AI...</span>
    `;
    setTimeout(() => {
      btn.innerHTML = `
        <span class="material-symbols-outlined text-xl">done_all</span>
        <span>Welcome Athlete!</span>
      `;
      btn.classList.replace('bg-athletic-green', 'bg-charcoal-dark');
    }, 900);
  }
</script></main></body></html>
