name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: Build Bruno Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            platforms;android-35
            build-tools;35.0.0
            platforms;android-34
            build-tools;34.0.0

      - name: Accept Android SDK Licenses
        run: |
          # Allow SIGPIPE from 'yes' when sdkmanager closes stdin, but fail CI if sdkmanager itself errors
          bash -c 'set +o pipefail; yes | sdkmanager --licenses'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Frontend Quality Verification
        working-directory: frontend
        run: |
          npm run type-check
          npm run lint
          npm test

      - name: Expo Prebuild (Android Native Scaffolding)
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'http://10.0.2.2:3000' }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: frontend/android
          cache-read-only: false

      - name: Build Android Debug APK with Gradle
        working-directory: frontend/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bruno-ai-gym-buddy-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
