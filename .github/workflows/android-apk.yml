name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    name: Build Bruno Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Quality Verification
        working-directory: frontend
        run: |
          npm run type-check
          npm run lint
          npm test

      - name: Expo Prebuild (Android Native Scaffolding)
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'http://10.0.2.2:3000' }}
        run: npx expo prebuild --platform android --clean

      - name: Build Android Debug APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bruno-ai-gym-buddy-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
